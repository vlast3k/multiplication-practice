<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Pro-Code Agents Demo</title>
    <style>
        :root {
            --primary: #0077ff;
            --primary-hover: #005ecc;
            --background-gradient: linear-gradient(135deg, #dfe9f3 0%, #ffffff 100%);
            --card-bg: rgba(255, 255, 255, 0.8);
            --shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: var(--background-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
        }

        /* Logo */
        #logo {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 130px;
            height: auto;
            z-index: 1000;
        }

        /* Card Container */
        #app {
            background: var(--card-bg);
            box-shadow: var(--shadow);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            margin-top: 120px;
            max-width: 600px;
            width: 100%;
            animation: fadeIn 0.6s ease;
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #222;
        }

        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            min-height: 170px;
            resize: vertical;
            transition: 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 6px rgba(0, 119, 255, 0.3);
        }


        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s ease;
        }

        button:hover {
            background: var(--primary-hover);
        }


        #response {
            margin-top: 20px;
            padding: 15px;
            background: #f8f8f8;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            white-space: pre-wrap;
        }

        .trace {
            background: #f3f3f3;
            padding: 10px;
            margin-top: 8px;
            border-radius: 8px;
            font-size: 0.9em;
            border-left: 4px solid var(--primary);
            animation: slideUp 0.4s ease;
        }

        .prompt-box {
            display: flex;
            flex-direction: column;
            gap: 10px; /* ✅ equal spacing between textarea and button */
        }

        /* Footer */
        footer {
            margin-top: auto;
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            text-align: center;
            padding: 12px 0;
            font-size: 0.9em;
            color: #444;
            border-top: 1px solid #ddd;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>


<!-- Main App -->
<div id="app">
    <h1>✨ IBD Pro-Code Agent Demo</h1>
    <div class="prompt-box">
        <textarea id="prompt" placeholder="Enter your prompt..."></textarea>
        <button onclick="sendPrompt()">🚀 Run Agent</button>
    </div>

    <div id="response"></div>
    <div id="traces"></div>
</div>

<!-- Footer -->
<footer>
    This Pro-Code Agent was created with SAP's Intent-Based Development (IBD)<br/>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    async function sendPrompt() {
        const prompt = document.getElementById('prompt').value;
        const responseDiv = document.getElementById('response');
        const tracesDiv = document.getElementById('traces');

        responseDiv.textContent = "⏳ Loading...";
        tracesDiv.innerHTML = "";

        try {
            const res = await fetch('/agent', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({prompt})
            });

            if (!res.ok) {
                responseDiv.textContent = `❌ Error: ${res.status} ${res.statusText}`;
                return;
            }

            const data = await res.json();
            responseDiv.innerHTML = marked.parse(data.response);

            data.traces.forEach(trace => {
                const t = document.createElement('div');
                t.className = 'trace';
                t.textContent = trace;
                tracesDiv.appendChild(t);
            });
        } catch (err) {
            responseDiv.textContent = "Error: " + err.message;
        }
    }
</script>
</body>
</html>
